<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AniList Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #7657d5;
        --danger: #c43d4b;
        --muted: rgba(128, 128, 128, .82);
        --surface: rgba(128, 128, 128, .11);
        --border: rgba(128, 128, 128, .24);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        color: CanvasText;
        background: transparent;
      }
      h1 { margin: 0; font-size: 19px; }
      h2 { margin: 0 0 10px; font-size: 14px; }
      p { margin: 6px 0; }
      small, .muted { color: var(--muted); }
      .stack { display: grid; gap: 10px; }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .spread { justify-content: space-between; }
      .card {
        padding: 11px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .error { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
      .error-text { color: var(--danger); overflow-wrap: anywhere; }
      .candidate { display: grid; gap: 8px; }
      label { display: grid; gap: 4px; }
      .inline-label { display: flex; align-items: center; gap: 7px; }
      input, button { font: inherit; }
      input[type="search"], input[type="password"], input[type="number"] {
        width: 100%; min-width: 0; padding: 7px 8px; color: inherit;
        border: 1px solid var(--border); border-radius: 7px; background: Canvas;
      }
      input[type="number"] { width: 88px; }
      button {
        padding: 6px 9px; color: inherit; border: 1px solid var(--border);
        border-radius: 7px; background: var(--surface); cursor: pointer;
      }
      button.primary { color: white; border-color: var(--accent); background: var(--accent); }
      button.danger { color: white; border-color: var(--danger); background: var(--danger); }
      button.link { padding: 0; border: 0; color: var(--accent); background: transparent; }
      button:disabled { opacity: .5; cursor: default; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .pill { padding: 2px 6px; border-radius: 999px; background: var(--surface); color: var(--muted); }
      .divider { height: 1px; background: var(--border); }
      details > summary { cursor: pointer; font-weight: 600; }
      dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      @media (prefers-color-scheme: dark) { :root { --accent: #9b82ee; --danger: #ee6875; } }
    </style>
    <script defer src="index.js"></script>
  </head>
  <body>
    <main id="app" class="stack" aria-live="polite">
      <p class="muted">Loading AniList Sync…</p>
    </main>
  </body>
</html>
